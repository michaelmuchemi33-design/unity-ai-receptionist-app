name: Unity AI Receptionist Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Accept Android SDK licences and install Android 17 SDK 37.0
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Require permanent signing key before publishing
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "Refusing to publish an APK signed with an ephemeral debug key."
            echo "Configure the permanent ANDROID_KEYSTORE_BASE64 and related signing secrets."
            exit 1
          fi

      - name: Prepare signing key and build number
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "ORG_GRADLE_PROJECT_appVersionCode=$((400000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/twiga.p12"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/twiga.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - name: Run tests and build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Build optimized release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Install Android emulator image for API 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Run Android 15 emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Upload debug APK (testing)
        uses: actions/upload-artifact@v4
        with:
          name: unity-ai-receptionist-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: unity-ai-receptionist-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish optimized APK download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk unity-ai-receptionist.apk
          CODE=$((400000 + GITHUB_RUN_NUMBER))
          SIZE=$(stat -c%s unity-ai-receptionist.apk)
          printf '{"build": %s, "size": %s, "apk": "https://github.com/%s/releases/download/latest-apk/unity-ai-receptionist.apk"}' "$CODE" "$SIZE" "$GITHUB_REPOSITORY" > version.json
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release upload latest-apk unity-ai-receptionist.apk version.json --clobber
            gh release edit latest-apk --title "Unity AI Receptionist - Latest Optimized APK" --notes "Optimized release build. build: $CODE. Signed with the permanent TWIGA release key."
          else
            gh release create latest-apk unity-ai-receptionist.apk version.json --title "Unity AI Receptionist - Latest Optimized APK" --notes "Optimized release build. build: $CODE. Signed with the permanent TWIGA release key." --prerelease
          fi
