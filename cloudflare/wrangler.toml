name = "twiga-storage-api"
main = "src/index.ts"
compatibility_date = "2026-11-07"
workers_dev = true

[vars]
SUPABASE_URL = "https://ztyxxikkposfpxsutnfr.supabase.co"
MAX_UPLOAD_BYTES = "26214400"

[[d1_databases]]
binding = "DB"
database_name = "twiga-business-data"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "twiga-business-files"

[[kv_namespaces]]
binding = "CACHE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[triggers]
crons = ["17 2 * * *"]
